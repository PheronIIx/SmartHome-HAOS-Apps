name: SmartHome Deploy checks
on:
  push:
    paths:
      - "smarthome-deploy/**"
      - ".github/workflows/smarthome-deploy-checks.yaml"
  pull_request:
    paths:
      - "smarthome-deploy/**"
      - ".github/workflows/smarthome-deploy-checks.yaml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m compileall -q smarthome-deploy/app
      - name: Run unit tests
        working-directory: smarthome-deploy
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Parse app manifest
        run: |
          python -m pip install --quiet pyyaml
          python -c "import yaml; data=yaml.safe_load(open('smarthome-deploy/config.yaml')); assert data['version']=='1.0.0-rc.4'"
      - name: Check JS syntax
        run: node --check smarthome-deploy/app/app.js
